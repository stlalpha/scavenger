[package]
name = "scavenger"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scavenger"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
image = "0.25"
lru = "0.12"
ratatui = "0.29"
ratatui-image = "3"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
log = "0.4"
rand = "0.8"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
