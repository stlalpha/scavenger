[package]
name = "scavenger"
version = "0.1.0"
edition = "2021"

[lib]
name = "scavenger"
path = "src/lib.rs"

[[bin]]
name = "scavenger"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
urlencoding = "2"
log = "0.4"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
