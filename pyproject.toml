[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scavenger"
version = "0.1.0"
description = "Continuous web intelligence terminal"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "click>=8.1",
    "textual>=0.60",
    "term-image>=0.7",
    "textual-image>=0.8",
    "playwright>=1.40",
    "playwright-stealth>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
scraping = [
    "beautifulsoup4>=4.12",
    "tomli-w>=1.0",
]

[project.scripts]
scavenger = "scavenger.main:cli"
scavenger-ctl = "scavenger.ctl:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/scavenger"]

[tool.uv]
override-dependencies = [
    "pillow>=11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
